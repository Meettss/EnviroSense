<!DOCTYPE html>
<html>
<head>
<title>EnviroSense Dashboard</title>
<style>
  /* Basic page styling - nothing fancy */
  body {
    font-family: Arial, sans-serif;
    background-color: #f0f0f0;
    padding: 20px;
  }

  h1 {
    color: #333;
  }

  /* Each sensor reading is shown in a box like this */
  .box {
    background-color: white;
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 15px;
    margin-bottom: 10px;
    font-size: 18px;
  }

  /* Anomaly text turns red, normal text turns green */
  .normal {
    color: green;
    font-weight: bold;
  }

  .anomaly {
    color: red;
    font-weight: bold;
  }
</style>
</head>
<body>

<h1>EnviroSense Live Dashboard</h1>
<p>This page generates a random sensor reading every 1.5 seconds and runs it through the trained model.</p>

<!-- These boxes will be filled in by JavaScript below -->
<div class="box">Temperature: <span id="tempBox">--</span> &deg;C</div>
<div class="box">Humidity: <span id="humBox">--</span> %</div>
<div class="box">Gas: <span id="gasBox">--</span> ppm</div>
<div class="box">Risk Index: <span id="riskBox">--</span></div>
<div class="box">Status: <span id="statusBox">--</span></div>

<script>
  // ---------------------------------------------------
  // STEP 1: Your trained model's weights and biases
  // (copied from the reg_model_v2.h and clf_model_v2.h
  // files you generated in Colab)
  // ---------------------------------------------------

  // Regression model (predicts risk_index)
  const reg_w0 = [
    [-9.661638513632966e-56, 0.6355970554865799, 0.19485413578082952, 0.013965925658384337, -0.49003682321278863, -2.4011106511995682e-17, -0.029605358523544015, 0.3766225037475303],
    [-1.9458882528667312e-63, 0.33919711192178725, -0.6736869560628955, 0.570433382945574, 0.4586113632552278, -8.93816267104511e-22, 0.010453568781724567, -0.29930402397180755],
    [-1.0235978619795377e-35, 0.10204089031967079, 0.04108044097911988, -0.3930950614067474, 0.10399393801073385, -2.5128850587901396e-16, -0.01314991099155581, -0.017304066947281663]
  ];
  const reg_b0 = [-0.06488893369764803, 1.118788024246143, 0.1189114520752684, -0.10665336539861363, -0.44390628086744993, -0.6699371391762778, 0.21868810749630918, -1.2229174787730925];
  const reg_w1 = [-3.971781593863674e-11, 0.763100550669128, 0.6728270661658474, 0.374080544774621, -0.2438765325582434, -2.2861258262128355e-12, -0.0031157898431798535, -0.2577847445346058];
  const reg_b1 = 0.06293996117713539;

  // Classification model (predicts NORMAL vs ANOMALY)
  const clf_w0 = [
    [-8.000374913038449e-08, 0.48792275915957695, -0.1490275591618893, 0.04197100942428132, -0.29373522812445596, -0.006179736113896021, -0.027404841515175703, 0.7205967863132052],
    [1.8438312750547703e-09, 0.17901463951878918, -0.3158303557211094, 0.5931100193394058, 0.6339915994177504, -0.0016415232016215938, -0.0035685369295672823, -0.31230233871373747],
    [-3.825112074180404e-05, 0.022211645451904505, 0.17997729397331866, -0.39679556533807175, 0.17491732582028524, -0.008417614047026928, -7.516739358656492e-05, 0.01231585971811625]
  ];
  const clf_b0 = [-0.06488893369764803, 0.1193136375588579, -1.21720861708472, -0.08181028523709613, 0.4984831241381828, -0.6699371391762778, 0.15885427401239494, 0.8161144130813934];
  const clf_w1 = [-0.041700226859689465, 0.5950014251775371, 0.7510549916554066, 0.4198444864686217, -0.38072250162637516, -0.028340493420164873, 6.0032643784391496e-05, -0.7547208801182046];
  const clf_b1 = -0.9494692368792433;

  // ---------------------------------------------------
  // STEP 2: The ReLU function
  // (same as the C++ version in Wokwi - if the number
  // is negative, make it 0; otherwise leave it alone)
  // ---------------------------------------------------
  function relu(x) {
    if (x > 0) {
      return x;
    } else {
      return 0;
    }
  }

  // ---------------------------------------------------
  // STEP 3: The model math itself
  // (same 2-step process as the C++ runModel function:
  // input -> hidden layer -> output)
  // ---------------------------------------------------
  function runModel(inputs, w0, b0, w1, b1) {
    // First, calculate all 8 hidden neurons
    let hidden = [0, 0, 0, 0, 0, 0, 0, 0];

    for (let h = 0; h < 8; h++) {
      let sum = 0;
      for (let i = 0; i < 3; i++) {
        sum = sum + inputs[i] * w0[i][h];
      }
      sum = sum + b0[h];
      hidden[h] = relu(sum);
    }

    // Then, combine the 8 hidden neurons into one final output
    let output = 0;
    for (let h = 0; h < 8; h++) {
      output = output + hidden[h] * w1[h];
    }
    output = output + b1;

    return output;
  }

  // ---------------------------------------------------
  // STEP 4: Generate one random, realistic sensor reading
  // ---------------------------------------------------
  function getRandomReading() {
    // Math.random() gives a random decimal between 0 and 1
    // We stretch that into our real sensor ranges

    let temp = 15 + Math.random() * 45;      // 15 to 60
    let humidity = Math.random() * 100;      // 0 to 100
    let gas = 75 + Math.random() * 485;      // 75 to 560

    return { temp: temp, humidity: humidity, gas: gas };
  }

  // ---------------------------------------------------
  // STEP 5: Run one full update cycle
  // ---------------------------------------------------
  function updateDashboard() {
    // Get a new random reading
    let reading = getRandomReading();
    let inputs = [reading.temp, reading.humidity, reading.gas];

    // Run both models
    let riskIndex = runModel(inputs, reg_w0, reg_b0, reg_w1, reg_b1);
    let anomalyScore = runModel(inputs, clf_w0, clf_b0, clf_w1, clf_b1);
    let isAnomaly = anomalyScore > 0.5;

    // Update the text on the page
    document.getElementById("tempBox").innerText = reading.temp.toFixed(1);
    document.getElementById("humBox").innerText = reading.humidity.toFixed(1);
    document.getElementById("gasBox").innerText = reading.gas.toFixed(0);
    document.getElementById("riskBox").innerText = riskIndex.toFixed(1);

    let statusBox = document.getElementById("statusBox");
    if (isAnomaly) {
      statusBox.innerText = "ANOMALY";
      statusBox.className = "anomaly";
    } else {
      statusBox.innerText = "NORMAL";
      statusBox.className = "normal";
    }
  }

  // ---------------------------------------------------
  // STEP 6: Run updateDashboard() once immediately,
  // then repeat it every 1500 milliseconds (1.5 seconds)
  // ---------------------------------------------------
  updateDashboard();
  setInterval(updateDashboard, 1500);

</script>

</body>
</html>
